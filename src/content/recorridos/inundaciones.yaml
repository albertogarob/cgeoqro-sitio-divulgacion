# Recorrido de scrollytelling. Esta es la fuente de verdad del texto del relato.
# Lo editan los autores a través de la ficha en Drive, no a mano:
#   npm run ficha:exportar -- <recorrido>
#   npm run ficha:importar -- <recorrido> <ficha.csv>
# "visual" amarra cada paso con su escena en el componente Astro: no se cambia,
# no se reordena y no se borra sin tocar también el componente.

capsula: "caudal-inundaciones"
titulo: "Reconstruir una inundación para anticipar la siguiente"
pasos:
  - visual: "apertura"
    pos: "center"
    tipo: "foto"
    imagen: "/scrolly/inund-villahermosa.jpg"
    credito: "Foto: Huitzil, inundación de 2007 en Villahermosa (CC BY 2.0)"
    texto: "Las inundaciones están entre los desastres más frecuentes y costosos del planeta. Tabasco lo sabe: cuando el Río de la Sierra se desborda, el agua se adueña del sur de Villahermosa."
  - visual: "frecuencia"
    pos: "center"
    tipo: "svg"
    texto: "No son un desastre más entre muchos. En el conteo de un año, de 387 desastres naturales registrados, 176 fueron inundaciones: casi la mitad."
  - visual: "mancha"
    pos: "right"
    tipo: "svg"
    texto: "Cuando el agua baja, los satélites dejan un retrato: la mancha de hasta dónde llegó. Pero esa silueta plana esconde lo que de verdad sirve para planear: qué tan profunda fue el agua, y qué caudal la empujó por el cauce."
  - visual: "metodo"
    pos: "right"
    tipo: "figura"
    imagen: "/scrolly/inund-metodo.png"
    imagenLado: "izq"
    credito: "Figura: Esqueda, Botello y Valdez, RIMNI 2024 (CC BY-NC-SA)"
    texto: "La propuesta va en reversa, de la huella visible a la causa invisible, uniendo tres piezas: información geoespacial del terreno, una simulación física del agua en movimiento, y un algoritmo evolutivo que afina la respuesta por prueba y error dirigido."
  - visual: "malla"
    pos: "left"
    tipo: "figura"
    imagen: "/scrolly/inund-malla.png"
    imagenLado: "der"
    credito: "Figura: Esqueda, Botello y Valdez, RIMNI 2024 (CC BY-NC-SA)"
    texto: "Todo ocurre sobre una malla en 3D del terreno, tejida con su altimetría y sus usos de suelo. Para el tramo estudiado del cauce son 21,890 pequeños triángulos de 5 metros de lado, cada uno una celda de cálculo."
  - visual: "aguas-someras"
    pos: "left"
    tipo: "svg"
    texto: "Sobre esa malla, el motor de simulación Iber resuelve las ecuaciones de aguas someras, una forma en 2D de las leyes del movimiento de fluidos. Celda por celda y paso a paso en el tiempo, calcula hacia dónde corre el agua y qué altura alcanza."
  - visual: "hidrograma"
    pos: "right"
    tipo: "svg"
    texto: "El ingrediente que falta es el caudal. Por la entrada del cauce se impone una curva de flujo que crece hasta un pico y luego cede. Ese pico, el gasto máximo, es la incógnita que hay que despejar."
  - visual: "comparacion"
    pos: "right"
    tipo: "figura"
    imagen: "/scrolly/inund-mancha.png"
    imagenLado: "izq"
    credito: "Figura: Esqueda, Botello y Valdez, RIMNI 2024 (CC BY-NC-SA)"
    texto: "Con un caudal de prueba, la simulación dibuja su propia mancha de inundación. El satélite Sentinel-1 aporta la real, en blanco y negro: 1 si la celda quedó bajo el agua, 0 si quedó en seco."
  - visual: "funcion-objetivo"
    pos: "left"
    tipo: "svg"
    texto: "Una función objetivo cuenta las celdas en las que ambas manchas no coinciden. Si calzan a la perfección vale cero; mientras más difieren, más alto el error. Ese número es la brújula de la búsqueda."
  - visual: "evolucion"
    pos: "right"
    tipo: "svg"
    texto: "Aquí entra la Evolución Diferencial. Una población de caudales candidatos compite, se combina y muta generación tras generación, empujada siempre hacia el menor error, imitando a la selección natural."
  - visual: "convergencia"
    pos: "left"
    tipo: "figura"
    imagen: "/scrolly/inund-evolucion.png"
    imagenLado: "der"
    credito: "Figura: Esqueda, Botello y Valdez, RIMNI 2024 (CC BY-NC-SA)"
    texto: "En cerca de 300 evaluaciones el error se desploma y se estabiliza: la mejor solución y el promedio de la población se juntan. La búsqueda converge al caudal que mejor reproduce la inundación observada."
  - visual: "caudal"
    pos: "center"
    tipo: "svg"
    texto: "Para ese tramo del Río de la Sierra, el caudal pico resultó cercano a 762 metros cúbicos por segundo, sostenido varios días. Y de regalo, la simulación recupera la profundidad del agua, de 1.5 a 5 metros, que el satélite nunca vio."
  - visual: "cierre"
    pos: "center"
    tipo: "foto"
    imagen: "/scrolly/inund-cierre.jpg"
    credito: "Foto: Alfonsobouchot, río Grijalva en Villahermosa (CC BY-SA 4.0)"
    texto: "Así, un modelo físico y un algoritmo convierten una foto plana en un mapa con extensión y profundidad reales. Mejor materia prima para prevenir, alertar y responder. Ciencia geoespacial al servicio de la sociedad."
