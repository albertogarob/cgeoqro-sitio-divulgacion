# Recorrido de scrollytelling. Esta es la fuente de verdad del texto del relato.
# Lo editan los autores a través de la ficha en Drive, no a mano:
#   npm run ficha:exportar -- <recorrido>
#   npm run ficha:importar -- <recorrido> <ficha.csv>
# "visual" amarra cada paso con su escena en el componente Astro: no se cambia,
# no se reordena y no se borra sin tocar también el componente.

capsula: "mapas-sequia"
titulo: "Predecir la sequía: mapas que se adelantan a la falta de agua"
pasos:
  - visual: "apertura"
    pos: "center"
    tipo: "foto"
    imagen: "/scrolly/sequia-tierra-seca.jpg"
    credito: "Foto: Hydrosami, tierra agrietada (CC BY-SA 4.0)"
    texto: "La sequía es un desastre lento: un periodo seco prolongado que deja sin agua a personas y ecosistemas."
  - visual: "impactos"
    pos: "right"
    tipo: "foto"
    imagen: "/scrolly/sequia-embalse-seco.jpg"
    credito: "Foto: Basotxerri, embalse en sequía (CC BY-SA 4.0)"
    texto: "No es una sola cosa. Golpea a la agricultura, al agua potable y a las comunidades rurales, muchas veces antes de que se note."
  - visual: "mapa"
    pos: "right"
    tipo: "svg"
    texto: "Para verla, los científicos hacen mapas de sequía con datos de satélites, estaciones y sensores. Cada región recibe uno de cinco niveles de severidad, del más leve al excepcional."
  - visual: "severidad"
    pos: "right"
    tipo: "svg"
    texto: "Esos mapas no los dibuja una máquina: un grupo de expertos interpreta los datos crudos cada semana y decide el nivel de cada zona. Donde el rojo se oscurece, hay pérdidas de cosechas y emergencias de agua."
  - visual: "pregunta"
    pos: "left"
    tipo: "svg"
    texto: "La pregunta que abre este trabajo: con los mapas pasados, ¿se puede estimar el próximo? Eso exige leer a la vez el espacio y el tiempo, y casi nadie lo había intentado así."
  - visual: "datos"
    pos: "left"
    tipo: "svg"
    texto: "Lo primero fue juntar el material: 1,183 mapas del monitor de sequías de Estados Unidos, uno por semana, desde enero del año 2000 hasta agosto de 2022. Se descargaron a mano, uno por uno."
  - visual: "preparacion"
    pos: "left"
    tipo: "svg"
    texto: "Luego hay que preparar las imágenes. Se recorta el territorio continental para no cargar con Alaska ni Puerto Rico, y el color se convierte en escala de grises: cuanto más oscuro, más severa la sequía."
  - visual: "ventana"
    pos: "right"
    tipo: "svg"
    texto: "El truco está en cómo se le pregunta a la máquina. Se apilan seis mapas consecutivos, como fotogramas de una película, y se le pide que dibuje el séptimo. Con eso ve el espacio y su evolución a la vez."
  - visual: "idea"
    pos: "right"
    tipo: "svg"
    texto: "La herramienta es una red neuronal de Convolución-LSTM. La convolución pasa una ventanita por el mapa y mira cada zona junto a sus vecinas; la parte LSTM guarda lo que vio en las semanas anteriores."
  - visual: "entrenamiento"
    pos: "right"
    tipo: "svg"
    texto: "Entrenarla es repetir un ejercicio miles de veces: la red propone un mapa, se compara con el que de verdad ocurrió, se mide en qué se equivocó y se corrige. Poco a poco afina."
  - visual: "reparto"
    pos: "left"
    tipo: "svg"
    texto: "Para no engañarse, las muestras se reparten en tres montones: unas 658 para entrenar, 165 para ir ajustando y 354 que la red no ve nunca hasta el examen final. Cada muestra es una pila de seis mapas."
  - visual: "resultado"
    pos: "left"
    tipo: "svg"
    texto: "El examen se juega contra un rival muy terco: suponer que la próxima semana será igual que esta. La red gana, con un error de 0.018 frente a 0.020, alrededor de un diez por ciento menos."
  - visual: "costo"
    pos: "left"
    tipo: "svg"
    texto: "Esa mejora sale cara. El entrenamiento usó dos tarjetas gráficas a la vez y llevó el equipo al máximo. Los autores advierten que estas redes piden mucho cómputo y memoria, para entrenar y también para estimar, y que hay que adaptarlas a cada región."
  - visual: "cierre"
    pos: "center"
    tipo: "foto"
    imagen: "/scrolly/sequia-riego.jpg"
    credito: "Foto: USDA, riego (dominio público)"
    texto: "Anticipar la sequía permite cuidar el agua, proteger los cultivos y decidir a tiempo. Ciencia geoespacial al servicio de la sociedad."
