# Recorrido de scrollytelling. Esta es la fuente de verdad del texto del relato.
# Lo editan los autores a través de la ficha en Drive, no a mano:
#   npm run ficha:exportar -- <recorrido>
#   npm run ficha:importar -- <recorrido> <ficha.csv>
# "visual" amarra cada paso con su escena en el componente Astro: no se cambia,
# no se reordena y no se borra sin tocar también el componente.

capsula: "utopias-iztapalapa"
titulo: "Utopías: cómo una periferia reinventó el cuidado en la ciudad"
pasos:
  - visual: "apertura"
    pos: "center"
    tipo: "foto"
    imagen: "/scrolly/utopias-periferia.jpg"
    credito: "Foto: Gzzz, Ecatepec (CC BY-SA 4.0)"
    texto: "Durante décadas, Iztapalapa fue vista como el \"patio trasero\" de la Ciudad de México."
  - visual: "densidad"
    pos: "right"
    tipo: "svg"
    texto: "Es la alcaldía más poblada de las dieciséis: 1.83 millones de personas, casi uno de cada cinco habitantes de la capital."
  - visual: "marginacion"
    pos: "right"
    tipo: "svg"
    texto: "Más de la mitad de su población habita en zonas con desarrollo social bajo o muy bajo. El trabajo de cuidar recae, sobre todo, en las mujeres."
  - visual: "autoconstruccion"
    pos: "right"
    tipo: "foto"
    imagen: "/scrolly/utopias-autoconstruccion.jpg"
    credito: "Foto: Gzzz, Ecatepec (CC BY-SA 4.0)"
    texto: "Buena parte de estos barrios se construyó a mano: levantados y organizados por sus propios vecinos, con o sin apoyo del Estado. De ahí viene una larga costumbre de organizarse."
  - visual: "utopias"
    pos: "left"
    tipo: "svg"
    texto: "Entre 2019 y 2024 surgieron centros comunitarios en los trece distritos: las Utopías. La primera abrió en Teotongo, en 2021, y entre 2022 y 2024 sumaron más de ocho millones de visitas."
  - visual: "metodo"
    pos: "left"
    tipo: "svg"
    texto: "Para saber qué ocurre de verdad ahí dentro, tres investigadoras hicieron cinco visitas de campo y diecinueve entrevistas entre 2023 y 2025: a vecinas, a quienes trabajan en el programa y a quienes lo diseñaron."
  - visual: "dentro"
    pos: "left"
    tipo: "svg"
    texto: "Una Utopía no es un edificio, es un conjunto. Canchas y albercas, escuelas de arte, bibliotecas, huertos y humedales, hasta un planetario o un temazcal. Todo público y gratuito, en el barrio."
  - visual: "casas"
    pos: "right"
    tipo: "svg"
    texto: "Dentro están las casas sociales: para personas mayores, para población LGBTQ+, para rehabilitación física, para tratar adicciones. Y la Casa de las Siemprevivas, nacida en la pandemia acompañando a mujeres que vivían violencia."
  - visual: "cuidados"
    pos: "right"
    tipo: "svg"
    texto: "Junto a ellas, lo más cotidiano: estancias infantiles, lavanderías y comida preparada a precios simbólicos. Cuidar deja de ser un asunto privado, y a quien cuida le devuelven horas de su día."
  - visual: "red"
    pos: "right"
    tipo: "svg"
    texto: "Todo junto teje una red de cuidado colectivo, pensada para poder llegar a ella: ocho de las trece Utopías conectan con Metro o Cablebús. Así se une el derecho a la ciudad con el urbanismo feminista."
  - visual: "inversion"
    pos: "left"
    tipo: "svg"
    texto: "La diferencia con los programas anteriores es de escala. Cada Utopía costó cerca de cinco millones de dólares, frente a los ochenta mil por proyecto del programa de mejoramiento barrial. Mantener cada una cuesta medio millón al año."
  - visual: "expansion"
    pos: "left"
    tipo: "svg"
    texto: "Lo que nació en la periferia se volvió política de toda la ciudad: hay cien nuevas Utopías proyectadas hasta 2030, y han venido a conocerlas desde veinte países."
  - visual: "desafios"
    pos: "left"
    tipo: "svg"
    texto: "Nada de esto está resuelto. Las autoras agrupan los pendientes en tres frentes: el dinero para mantener las Utopías y pagar salarios justos, el enlace con otros programas de la ciudad, y una coordinación que no termine reconcentrando el poder ni diluyendo la participación vecinal."
  - visual: "cierre"
    pos: "center"
    tipo: "foto"
    imagen: "/scrolly/utopias-comunidad.jpg"
    credito: "Foto: Rollcloud, tianguis (dominio público)"
    texto: "¿Hacia el derecho a las ciudades cuidadoras? Una innovación local que se vuelve política pública."
